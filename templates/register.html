<!DOCTYPE html>
<html>
    <head>
        <link href="https://fonts.googleapis.com/css2?family=Roboto&display=swap" rel="stylesheet">
        <link href="https://fonts.googleapis.com/css2?family=Roboto:wght@500&display=swap" rel="stylesheet">
        <link href="https://fonts.googleapis.com/css2?family=Roboto:wght@700&display=swap" rel="stylesheet">
        <link rel="stylesheet" href="{{url_for('static',filename='styles.css')}}">
    </head>
    <body>
        <div class="register-form">
            <form id="registeration">
                <div>
                    <p class="form-text">Registeration</p>
                </div>
                
                <div>
                    <label class="name-text">Name:</label>
                    <input type="text" id="registeration_name" name="name" placeholder="Enter your name here">
                </div>
                
                <br><br>

                <div>
                    <label class="email-text">Email:</label>
                    <input type="email" id="registeration_email" placeholder="Enter your email" >
                </div>
                
                <br><br>

                <div>
                    <label class="password-text">Password:</label>
                    <input type="password" id="registeration_password" placeholder="Enter password"  >
                </div>
               
                <br><br>

                <div>
                    <button type="submit" id="registeration_button" class="button">Register</button>
                </div>
                
                <div>
                    <p id="register_message" class="register-message"></p>
                </div>
            </form>
        </div>
        <script src="{{url_for('static',filename='register.js')}}"></script>
    </body>
</html>

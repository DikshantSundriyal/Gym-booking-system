<!DOCTYPE html>
<html>
    <head>
        <link href="https://fonts.googleapis.com/css2?family=Roboto&display=swap" rel="stylesheet">
        <link href="https://fonts.googleapis.com/css2?family=Roboto:wght@500&display=swap" rel="stylesheet">
        <link href="https://fonts.googleapis.com/css2?family=Roboto:wght@700&display=swap" rel="stylesheet">
        <link rel="stylesheet" href="{{url_for('static',filename='styles.css')}}">
    </head>
    <body>
        <div class="login-form">
            <form id="login">
                <div>
                    <p class="form-text">Login</p>
                </div>

                <div>
                    <label class="name-text">Name:</label>
                    <input type="text" id="login_name" placeholder="Enter your name here">
                </div>

                <br><br>

                <div>
                    <label class="email-text">Email:</label>
                    <input type="email" id="login_email" placeholder="Enter your email" >
                </div>
                
                <br><br>

                <div>
                    <label class="password-text">Password:</label>
                    <input type="password" id="login_password" placeholder="Enter password"  >
                </div>

                <br><br>

                <div>
                    <button type="submit" id="login_button" class="button">Log In</button>
                </div>

                <br><br>

                <div>
                    <a class="register_link" href="{{ url_for('register') }}">Register here</a>
                </div>
                
                <br><br>

                <div>
                    <p id="login_Message" class="login-message"></p>
                </div>
            </form>
        </div>
        <script src="{{url_for('static',filename='login.js')}}"></script>
    </body>
</html>
